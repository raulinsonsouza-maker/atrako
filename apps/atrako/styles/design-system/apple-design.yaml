# Atrako Design System — canon (Apple language)
# Executable CSS lives in tokens.css / typography.css / components.css
# UI primitives live in apps/atrako/components/ui/*
version: alpha
name: Apple-design-analysis
description: Photography-first museum gallery language. Single Action Blue accent. UI chrome recedes.

colors:
  primary: "#0066cc"
  primary-focus: "#0071e3"
  primary-on-dark: "#2997ff"
  ink: "#1d1d1f"
  body: "#1d1d1f"
  body-on-dark: "#ffffff"
  body-muted: "#cccccc"
  ink-muted-80: "#333333"
  ink-muted-48: "#7a7a7a"
  divider-soft: "#f0f0f0"
  hairline: "#e0e0e0"
  canvas: "#ffffff"
  canvas-parchment: "#f5f5f7"
  surface-pearl: "#fafafc"
  surface-tile-1: "#272729"
  surface-tile-2: "#2a2a2c"
  surface-tile-3: "#252527"
  surface-black: "#000000"
  surface-chip-translucent: "#d2d2d7"
  on-primary: "#ffffff"
  on-dark: "#ffffff"
  # Data viz (dashboards) — derivados do accent, sem segundo brand
  chart-result: "#0066cc"
  chart-spend: "#b8d3f0"
  chart-plan: "#d2d2d7"
  chart-revenue: "#16a34a"
  chart-current: "{colors.primary} @ 14%"
  positive: "#16a34a"
  negative: "#dc2626"

typography:
  hero-display: { fontSize: 56px, fontWeight: 500, lineHeight: 1.07, letterSpacing: -0.03em }
  display-lg: { fontSize: 40px, fontWeight: 500, lineHeight: 1.1, letterSpacing: -0.025em }
  display-md: { fontSize: 34px, fontWeight: 500, lineHeight: 1.2, letterSpacing: -0.02em }
  lead: { fontSize: 28px, fontWeight: 400, lineHeight: 1.2, letterSpacing: -0.02em }
  lead-airy: { fontSize: 24px, fontWeight: 300, lineHeight: 1.5, letterSpacing: -0.015em }
  tagline: { fontSize: 20px, fontWeight: 500, lineHeight: 1.25, letterSpacing: -0.02em }
  body-strong: { fontSize: 15px, fontWeight: 500, lineHeight: 1.5, letterSpacing: -0.011em }
  body: { fontSize: 15px, fontWeight: 400, lineHeight: 1.5, letterSpacing: -0.011em }
  dense-link: { fontSize: 15px, fontWeight: 400, lineHeight: 2.2, letterSpacing: -0.011em }
  caption: { fontSize: 13px, fontWeight: 400, lineHeight: 1.45, letterSpacing: -0.011em }
  caption-strong: { fontSize: 13px, fontWeight: 500, lineHeight: 1.45, letterSpacing: -0.011em }
  button-large: { fontSize: 18px, fontWeight: 400, lineHeight: 1.0, letterSpacing: -0.011em }
  button-utility: { fontSize: 13px, fontWeight: 400, lineHeight: 1.3, letterSpacing: -0.011em }
  fine-print: { fontSize: 12px, fontWeight: 400, lineHeight: 1.35, letterSpacing: -0.01em }
  micro-legal: { fontSize: 10px, fontWeight: 400, lineHeight: 1.35, letterSpacing: 0 }
  # SaaS sidebar
  nav-link: { fontSize: 13px, fontWeight: 500, lineHeight: 1.35, letterSpacing: -0.011em }

# Geist. Ênfase da interface é 500. 600 fica raro.

rounded:
  none: 0px
  xs: 5px
  sm: 8px
  md: 11px
  lg: 18px
  pill: 9999px
  full: 9999px

spacing:
  xxs: 4px
  xs: 8px
  sm: 12px
  md: 17px
  lg: 24px
  xl: 32px
  xxl: 48px
  section: 80px

shadow:
  product: "3px 5px 30px 0 rgba(0, 0, 0, 0.22)"

frosted: "saturate(180%) blur(20px)"

breakpoints:
  phone-sm: 419px
  phone: 640px
  large-phone: 735px
  tablet: 833px
  tablet-landscape: 1023px
  desktop-sm: 1068px
  desktop: 1440px

components:
  button-primary: { file: components/ui/button.tsx, variant: primary }
  button-secondary-pill: { file: components/ui/button.tsx, variant: secondary-pill }
  button-dark-utility: { file: components/ui/button.tsx, variant: dark-utility }
  button-pearl-capsule: { file: components/ui/button.tsx, variant: pearl }
  button-store-hero: { file: components/ui/button.tsx, variant: store-hero }
  button-icon-circular: { file: components/ui/icon-button.tsx, note: "size toolbar = 36px com borda, para utilitários (ex.: editar etapas) ao lado do CTA" }
  segmented-control: { file: components/ui/segmented-control.tsx, css: ".segmented", note: "Alternar visualização (Funil/Lista) — pill 36px, mesma borda/tipo do pill-select" }
  toggle-switch: { file: components/ui/switch.tsx, css: ".toggle-switch", note: "Liga/desliga de configuração (Config → Módulos) — 44x26, ligado = --primary; nunca checkbox nativo" }
  info-hint: { file: components/ui/info-hint.tsx, css: ".info-hint / .info-hint-pop", note: "Ícone 'i' ao lado do título abre balão curto (máx. 280px, hairline, sem sombra). Explicação longa vai aqui — nunca parágrafo fixo na tela" }
  filter-toolbar: { css: ".crm-toolbar", note: "Esquerda = como ver os dados (search-input, date-range-filter, pill-select, segmented-control, pill). Direita = ações (icon-button toolbar + Button toolbar primary, radius-xs)" }
  pill-select-multi: { file: components/ui/pill-select.tsx, export: PillMultiSelect, css: ".pill-select-check", note: "Múltipla escolha no mesmo filtro — menu fica aberto, primeira opção limpa; trigger 'Meta Ads +2'" }
  channel-color: { file: lib/commerce-attribution/channel-color.ts, tokens: "--channel-*", note: "Cor por canal de aquisição — só identificação (ponto + tinta 12% no chip do lead, swatch no filtro). Nunca em botão/CTA" }
  global-nav-collapsed: { file: components/layout/AppSidebar.tsx, css: ".nav-collapsed-divider / .nav-tip", note: "Menu recolhido (72px): ícones 40px centrados, separador no lugar do título, rótulo + descrição flutuante à direita; preferência salva no navegador" }
  app-top-bar: { file: components/layout/AppTopBar.tsx, css: ".app-top-bar / .rel-bell-*", note: "Topo da área de conteúdo: sino de notificações (IconButton toolbar + contador danger) no canto direito, painel alinhado à direita. Celular: + abrir menu e marca, sticky" }
  pill-select-count: { file: components/ui/pill-select.tsx, note: "option.count — número à direita só no menu; o trigger fica limpo" }
  filter-strip: { css: ".crm-filter-strip / .crm-filter-chip", note: "Linha sob a filter-toolbar: filtros ativos como chips removíveis (×) + resumo curto à direita. Sem frases longas" }
  date-range-filter: { file: components/ui/date-range-filter.tsx, note: "Único filtro de período — presets + 2 meses. variant toolbar (pill 36px) | panel (topo do dashboard); allowAll = 'Todo o período'" }
  text-link: { file: components/ui/text-link.tsx }
  back-link: { file: components/ui/back-link.tsx, note: "Voltar canônico — ChevronLeft + rótulo; App shell" }
  search-input: { file: components/ui/search-input.tsx, note: "Única busca — size toolbar|field; nunca input reinventado" }
  product-tile: { file: components/ui/product-tile.tsx }
  pipeline-column: { css: ".pipeline-column / .pipeline-lead-card", note: "CRM funil — coluna canvas + body parchment + card canvas/hairline; mais quente no topo" }
  pipeline-lead-heat: { css: ".pipeline-lead-time[data-heat]", note: "Idade do lead em dias (hoje / ontem / há N dias; abandono nas colunas de carrinho). hot ≤3d danger 600, warm ≤14d ink-80, cold muted. Data exata só no title" }
  caixa-panel: { css: ".caixa-*", note: "Finance/Caixa — saldo tile escuro + KPIs canvas + extrato lista" }
  criar-catalog: { css: ".criar-platform-* / .criar-recipe-* / .criar-filter-*", note: "Hub Criar — plataformas + receitas; badges DS" }
  lp-phone-preview: { file: components/criar/LpPhonePreview.tsx, css: ".lp-preview / .lp-phone-*", note: "Preview iPhone da LP no Criar oferta + sucesso" }
  panel-modal: { css: ".panel-modal-*", note: "Sheet lateral de detalhe (CRM lead) — mantém contexto da tela" }
  relacionamento: { file: components/relacionamento/ui.tsx, css: ".rel-*", note: "Fluxos/campanhas/envios — RelSection (título curto + info-hint + ação), RelKpi (número + detalhe + variação), lista de pendências, status de canais, badges ok/warn/bad, editor + preview, sino de notificações" }
  store-utility-card: { file: components/ui/card.tsx }
  sub-nav-frosted: { file: components/ui/sub-nav-frosted.tsx }
  floating-sticky-bar: { file: components/ui/floating-sticky-bar.tsx }
  configurator-option-chip: { file: components/ui/option-chip.tsx }
  pill-select: { file: components/ui/pill-select.tsx, note: "Único select do produto — nunca <select> nativo; size toolbar|field" }
  brand-logo: { file: components/ui/brand-logo.tsx, note: "Logo de parceiro (simple-icons CC0) em tile 10px — só integrações de terceiros, nunca accent" }
  text-field: { file: components/ui/text-field.tsx, note: "Campo de formulário canônico — label + input h-11 radius-xs + hint; type=password com olho" }
  app-page: { file: components/layout/AppPage.tsx, note: "Shell de página AppShell — padding/título densos" }
  thinking-orb: { file: components/ui/thinking-orb.tsx, css: ".thinking-orb / .thinking-label-*", note: "Esfera de pontos (canvas) do assistente — idle | thinking | resolved. Pontos em --ink, resolve para --primary; ThinkingLabel troca rótulos (Pensando…) e mostra 'Pronto'. Estático em reduced-motion" }
  orb-composer: { file: components/ui/orb-composer.tsx, css: ".orb-composer-*", note: "Campo de pergunta do assistente — pílula 60px (como search), anel conic --primary girando no foco/digitando/enviando (é o indicador de foco, não decoração). Enviar circular dentro da pílula; Enter envia, Shift+Enter quebra linha; tremida quando vazio" }
  assistant-shell: { file: app/agent/AgentConsole.tsx, css: ".assistant-*", note: "Assistente — histórico (card canvas 280px, começa recolhido; grupos Hoje/Ontem/7 dias, item ativo com fio --primary) + palco (hero 'Olá, eu sou o Atrako' com orb → fio de mensagens + composer fixo embaixo). Abaixo de desktop-sm o histórico vira gaveta. Sem app-top-bar nesta rota: header único 56px (menu no celular + histórico | título | sino + nova conversa)" }
  assistant-reply: { file: app/agent/AssistantMarkdown.tsx, css: ".assistant-md-* / .assistant-caret / .assistant-msg-meta", note: "Resposta do Atrako em markdown mínimo (negrito, listas, tabela hairline) — chega em streaming com cursor --primary; rótulos do orb = passos reais das ferramentas; 'Pensou por Ns' em fine-print" }
  assistant-action-card: { css: ".assistant-action-card / .assistant-action-row", note: "Proposta de rascunho (LP/formulário) — card canvas hairline com resumo; 'Criar rascunho' (primary toolbar) + 'Agora não' (outline). Nada é publicado; depois mostra 'Abrir para revisar'" }
  assistant-artifacts: { file: app/agent/ArtifactList.tsx, css: ".assistant-artifacts / .assistant-status-badge / .assistant-resource-row", note: "Cards abaixo da resposta (máx. 6 por resposta), na ordem em que as ferramentas rodaram. Badge de status: Rascunho (pearl) · No ar (--primary 14%) · Falhou (--danger 12%)" }
  assistant-chart-card: { file: components/ui/chart-card.tsx, css: ".assistant-chart-card / .chart-card-*", note: "Gráfico montado no servidor — linha, barras, rosca ou funil. Só tokens --primary / --chart-spend / --chart-revenue / --chart-plan; período anterior tracejado; grade horizontal --divider-soft; sem sombra, sem gradiente; tooltip canvas hairline" }
  assistant-reference-card: { css: ".assistant-reference-card / .assistant-reference-*", note: "Fontes da web numeradas (1, 2, 3…) — título, domínio em fine-print e trecho em 2 linhas; abre em nova aba" }
  assistant-lp-preview: { css: ".assistant-lp-preview / .assistant-lp-preview-*", note: "Prévia viva da LP/formulário em iframe (modo teste) — Computador renderiza a 1280px reduzido para caber; Celular 390px centralizado em moldura hairline. Ações toolbar: Abrir em nova aba · Testar · Abrir no Criar · Publicar (primary)" }
  lp-html-v3: { file: components/commerce/SalesPageHtmlView.tsx, css: ".atrako-lp-v3 / .atrako-slot", note: "LP gerada pelo assistente — HTML/CSS próprios da marca do cliente (fora do DS do app), sanitizados e com escopo .atrako-lp-v3; títulos h1–h6 herdam cor/fonte da página (não o --ink global). Formulário e checkout são sempre os componentes nativos do DS dentro de .atrako-slot (máx. 520px, tipografia do app)" }
  assistant-contact-card: { file: app/agent/ContactCard.tsx, css: ".assistant-contact-card / .assistant-contact-*", note: "Cartão do cliente na conversa — reaproveita CrmLeadCard (pipeline-lead-card), chips de compra (etapa, ciclo de vida, pedidos) e o carrinho com miniaturas, total e status da mensagem de recuperação; ações Abrir no CRM / Copiar link de recuperação / Ver jornada" }
  assistant-test-card: { css: ".assistant-test-card / .assistant-test-*", note: "Resultado de teste do formulário/checkout — checklist com ícone circular (ok = --primary, falha = --danger) e os valores enviados em linhas dt/dd" }
  footer: { file: components/ui/site-footer.tsx }
  global-nav: { file: components/layout/AppSidebar.tsx, note: "SaaS rail — type-nav-link 13/500 + type-fine-print desc; pairs with type-tagline page titles. Início (Assistente + Dashboard) · Criar · Operação; rodapé só ícones (Configuração, Sair). Conta escolhida no título do Dashboard, nunca listada no menu" }

rules:
  do:
    - Single accent Action Blue for all interactive
    - Store / marketing headlines type-hero-display / type-display-lg with negative tracking
    - App shell page titles type-tagline (20/500) — same scale as sidebar brand; never type-display-lg beside global-nav
    - Body 15px type-body weight 400; emphasis is weight 500 (type-body-strong, type-caption-strong, type-nav-link)
    - Alternate light/dark tiles for section rhythm
    - CTA / buttons use radius-xs (~5px) — not pill; pill only for search, chips, pill-select
    - shadow-product only on product imagery
    - active scale 0.95 on buttons
    - All dropdowns via pill-select (PillSelect) — toolbar h-9 or field h-11 w-full
  dont:
    - Second brand accent
    - Shadows on cards buttons text
    - Decorative gradients
    - font-weight 600 / font-bold on UI chrome (use 500)
    - Round full-bleed tiles
    - Pill-shaped CTAs / primary buttons (use radius-xs)
    - Body line-height below 1.5
    - primary-on-dark on light surfaces
    - Marketing display scale (display-lg / lead) inside AppShell pages
    - Native HTML select / option menus — browser chrome breaks the DS
