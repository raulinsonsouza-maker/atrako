<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Automação iPhone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container do Mockup do Celular -->
    <div class="iphone-container">
        <!-- Borda preta física do aparelho -->
        <div class="iphone-screen">
            
            <!-- Barra Superior (Status Bar + Recorte do Entalhe) -->
            <div class="top-bar">
                <span class="time">9:41</span>
                <div class="island"></div>
                <div class="status-icons">
                    <span class="icon">📶</span>
                    <span class="icon">🔋</span>
                </div>
            </div>

            <!-- Cabeçalho do Chat -->
            <div class="chat-header">
                <div class="profile-pic"></div>
                <div class="profile-info">
                    <span class="username">@seu_perfil</span>
                    <span class="subtitle">Direct</span>
                </div>
            </div>

            <!-- Área Interna das Mensagens -->
            <div class="chat-body">
                <div class="direct-label">DIRECT</div>

                <!-- Mensagem 1: Texto de Boas-vindas -->
                <div class="msg bubble-received">
                    <p>Olá! Eu estou muito feliz que você está aqui, muito obrigado pelo seu interesse 😊</p>
                    <p>Clique abaixo e eu vou te mandar o link em um segundo ✨</p>
                </div>

                <!-- Mensagem 2: Botão de Interação (Cinza) -->
                <button class="btn-action">Me envie o link</button>

                <!-- Mensagem 3: Resposta do Usuário (Azul) -->
                <div class="msg bubble-sent">
                    Me envie o link
                </div>

                <!-- Mensagem 4: Texto de Entrega -->
                <div class="msg bubble-received">
                    Aqui está o seu acesso
                </div>

                <!-- Mensagem 5: Botão Final de Link -->
                <button class="btn-link">Acessar</button>
            </div>

            <!-- Barra de Navegação Inferior (Home Indicator) -->
            <div class="home-indicator-bar">
                <div class="home-indicator"></div>
            </div>

        </div>
    </div>

</body>
</html>
